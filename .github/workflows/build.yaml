name: Build profile README

on:
  push:
    branches: [main]
    paths-ignore: ["assets/**", "README.md"]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Build panels from live GitHub data
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN || github.token }}
        run: python scripts/build.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git diff --cached --quiet || { git commit -m "chore: rebuild profile README"; git push; }
